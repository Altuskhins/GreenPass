name: Release

# Publishes GreenPass.elyx + GreenPass.plugin as release v<version>-b<build> (version
# from plugin/meta.yml, build from GREENPASS_BUILD in plugin/greenpass/foundation.py)
# on a v* tag push or a manual run; skips versions that already
# have a release. Locally the same build is build.bat / scripts/build_release.py.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' plugin/meta.yml)
          build=$(sed -n 's/^GREENPASS_BUILD *= *\([0-9][0-9]*\) *$/\1/p' plugin/greenpass/foundation.py)
          if [ -z "$build" ]; then echo "GREENPASS_BUILD not found"; exit 1; fi
          # Auto-update compares the build id, so releases are tagged v<version>-b<build>.
          tag="v$version-b$build"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME != expected $tag (meta.yml version + GREENPASS_BUILD)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=GreenPass $version (сборка $build)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.exists != 'true'
        with:
          python-version: "3.11"

      - name: Build Elyx archive
        if: steps.version.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade ElyxBuilder
          elyb build --ast -nf
          mkdir -p dist
          cp builds/GreenPass-*.eaf dist/GreenPass.elyx

      - name: Build legacy single-file plugin
        if: steps.version.outputs.exists != 'true'
        run: python scripts/build_legacy_plugin.py plugin dist/GreenPass.plugin

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="release-notes/$tag.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$tag" dist/GreenPass.elyx dist/GreenPass.plugin \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.title }}" "${notes_arg[@]}"
